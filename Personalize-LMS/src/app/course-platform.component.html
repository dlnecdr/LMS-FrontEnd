<div class="course-platform-container">
  <div class="course-layout-grid">
    <!-- Course Content -->
    <div class="course-content-wrapper">
      <div class="course-lesson-container course-shadow">
        <div class="course-lesson-header course-text-primary">{{ topic.title }}</div>
        <div class="course-lesson-body" [innerHTML]="syllabus"></div>
        <div class="course-lesson-footer">
          <button class="course-button-primary" (click)="navigateToQuizPage()">Go to Quiz</button>
        </div>
      </div>
    </div>

    <!-- Chat Section -->
    <div class="course-chat-wrapper">
      <div class="course-chat-container">
        <div class="course-chat-header course-text-primary text-center">Ask Assistant</div>
        <div class="course-chat-messages">
          <div
            *ngFor="let message of chatMessages"
            [ngClass]="{
                'msg-user': message.sender === 'You',
                'msg-assistant': message.sender === 'Assistant'
            }"
            class="course-chat-message"
          >
            <strong>{{ message.sender }}:</strong> <div [innerHTML]="message.text"></div>
          </div>
        </div>

        <!-- Input Section -->
        <div class="course-chat-input">
          <div class="course-input-group">
            <input
              *ngIf="!isVoiceMode"
              type="text"
              class="course-input-field"
              [(ngModel)]="userMessage"
              placeholder="Type your question..."
              (keyup.enter)="sendMessage()"
            />
          </div>
          <button
            class="course-button-secondary"
            (click)="toggleVoiceInput()"
              [ngClass]="{ 'text-danger': isListening }"
          >
            <i class="bi bi-mic"></i> {{ isVoiceMode ? 'Stop Listening' : 'Voice Input' }}
          </button>
        </div>

          <button class="btn btn-primary mt-2" (click)="sendMessage()" [disabled]="isVoiceMode">
          Send
        </button>
      </div>
    </div>
  </div>
</div>
