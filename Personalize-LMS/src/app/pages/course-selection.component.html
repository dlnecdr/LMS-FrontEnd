<div class="course-selection-container">
  <div class="course-selection-header">
    <h2 class="section-title">Choose Your Course</h2>
    <p class="section-subtitle">Discover and enroll in courses that match your interests</p>
  </div>

  <div class="course-grid">
    <div class="course-card-wrapper" *ngFor="let course of courseList" (click)="goToCoursePlatform(course.id)">
      <div class="course-card">
        <div class="course-color-section">
          <div class="course-overlay">
            <span class="course-level">{{ course.level }}</span>
            <span class="course-duration">
              <i class="fas fa-clock"></i>
              {{ course.duration }}
            </span>
          </div>
        </div>
        
        <div class="course-content">
          <div class="course-category">{{ course.category }}</div>
          <h3 class="course-title">{{ course.title }}</h3>
          <p class="course-description">{{ course.description }}</p>
          
          <div class="course-footer">
            <div class="course-instructor">
              <img [src]="course.instructorImage" alt="Instructor" class="instructor-image" />
              <span>{{ course.instructor }}</span>
            </div>
            <div class="course-rating">
              <i class="fas fa-star"></i>
              <span>{{ course.rating }}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
